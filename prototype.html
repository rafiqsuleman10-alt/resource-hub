<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resource Hub prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A36; --ink-2:#4B5968; --ink-3:#7A8794;
  --bg:#E9EEF2; --surface:#FFFFFF; --surface-2:#F4F7F9; --line:#D5DDE3;
  --teal:#0C7A5E; --teal-soft:#DDF1EA; --amber:#A8620A; --amber-soft:#FBEBD3;
  --coral:#B63A24; --coral-soft:#F8E1DB; --slate:#2C3A48; --kiosk:#17212B; --kiosk-2:#22303D;
  --focus:#1B6FD1; --fs:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E6ECF1; --ink-2:#B3BFCA; --ink-3:#8594A2;
    --bg:#0F161D; --surface:#18222C; --surface-2:#1F2B36; --line:#2E3C4A;
    --teal:#3CC49A; --teal-soft:#15382E; --amber:#EBA64A; --amber-soft:#3A2A12;
    --coral:#F08469; --coral-soft:#3E1F18; --slate:#0B1117; --kiosk:#0A1016; --kiosk-2:#15202A; --focus:#6FA8F0;
  }
}
:root[data-theme="dark"]{
  --ink:#E6ECF1; --ink-2:#B3BFCA; --ink-3:#8594A2;
  --bg:#0F161D; --surface:#18222C; --surface-2:#1F2B36; --line:#2E3C4A;
  --teal:#3CC49A; --teal-soft:#15382E; --amber:#EBA64A; --amber-soft:#3A2A12;
  --coral:#F08469; --coral-soft:#3E1F18; --slate:#0B1117; --kiosk:#0A1016; --kiosk-2:#15202A; --focus:#6FA8F0;
}
:root.contrast{ --ink:#000; --ink-2:#1a1a1a; --ink-3:#333; --line:#000; --teal:#005A41; --amber:#7A4300; --coral:#8E1C08; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-size:var(--fs); line-height:1.45}
:root.large{--fs:19px}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.phone{max-width:430px; margin:0 auto; min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); background:var(--surface); display:flex; flex-direction:column; position:relative}
@media (min-width:600px){ .phone{margin:24px auto; min-height:calc(100dvh - 48px); border-radius:28px; overflow:hidden; box-shadow:0 0 0 1px var(--line), 0 30px 60px -30px rgba(20,30,40,.45)} }
header.top{padding:18px 20px 12px; background:var(--slate); color:#fff}
header.top h1{margin:0; font-size:1.35em; letter-spacing:-.01em}
.near{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:.9em; color:#C9D3DC}
.near select{background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:5px 8px}
.near select option{color:#000}
main{flex:1; overflow-y:auto; padding:16px 18px 96px}
nav.tabs{position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none; border:0; padding:10px 4px 12px; font-size:.82em; color:var(--ink-3); display:flex; flex-direction:column; align-items:center; gap:3px}
nav.tabs button[aria-current="page"]{color:var(--teal); font-weight:700}
nav.tabs svg{width:22px; height:22px}
.badge{display:inline-block; min-width:18px; padding:0 6px; border-radius:9px; background:var(--amber); color:#fff; font-size:.75em; font-weight:700; margin-left:4px}
h2{font-size:1.2em; margin:4px 0 12px}
h3{font-size:1em; margin:18px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--ink-2)} .small{font-size:.86em}
.search{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface-2)}
.chips{display:flex; gap:8px; overflow-x:auto; padding:12px 0 6px; margin:0 -18px; padding-left:18px; padding-right:18px; scrollbar-width:none}
.chip{flex:none; border:1.5px solid var(--line); background:var(--surface); border-radius:20px; padding:6px 13px; font-size:.88em; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.list{list-style:none; margin:6px 0 0; padding:0}
.row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:13px 2px}
.row .glyph{flex:none; width:40px; height:40px; border-radius:10px; display:grid; place-items:center; background:var(--surface-2); color:var(--ink-2)}
.row .glyph svg{width:22px; height:22px}
.row .txt{flex:1; min-width:0}
.row .name{font-weight:700}
.row .sub{font-size:.86em; color:var(--ink-2)}
.row .count{flex:none; text-align:right; font-size:.8em; color:var(--ink-3); line-height:1.2}
.row .count b{display:block; font-size:1.55em; color:var(--teal)}
.row .count.none b{color:var(--coral)}
.back{background:none; border:0; color:var(--teal); padding:4px 0; font-weight:700; margin-bottom:6px}
.strip{margin:6px 0 4px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line); padding:10px 10px 6px}
.strip svg{display:block; width:100%; height:auto}
.strip .cap{font-size:.78em; color:var(--ink-3); display:flex; justify-content:space-between; padding:2px 4px 0}
.nodes{display:grid; gap:8px; margin:10px 0}
.node{display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--surface); text-align:left; width:100%}
.node[aria-checked="true"]{border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); background:var(--teal-soft)}
.node[disabled]{opacity:.55; cursor:not-allowed}
.node .dot{flex:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-3)}
.node[aria-checked="true"] .dot{border:6px solid var(--teal)}
.node .n1{font-weight:700} .node .n2{font-size:.85em; color:var(--ink-2)}
.node .walk{margin-left:auto; text-align:right; font-size:.85em; color:var(--ink-2)}
.node .walk b{display:block; font-size:1.2em; color:var(--ink)}
.seg{display:flex; border:1.5px solid var(--line); border-radius:12px; overflow:hidden}
.seg button{flex:1; background:var(--surface); border:0; padding:10px 6px; font-size:.9em}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface); font-weight:700}
.note{border-radius:12px; padding:11px 13px; font-size:.9em; margin:12px 0}
.note.warn{background:var(--amber-soft); color:var(--ink)} .note.warn b{color:var(--amber)}
.note.ok{background:var(--teal-soft)} .note.bad{background:var(--coral-soft)}
.btn{display:block; width:100%; border:0; border-radius:14px; padding:14px; font-weight:700; font-size:1em; margin-top:10px}
.btn.primary{background:var(--teal); color:#fff}
.btn.secondary{background:var(--surface-2); color:var(--ink); border:1.5px solid var(--line)}
.btn.danger{background:none; color:var(--coral); border:1.5px solid var(--coral-soft)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.hold{background:var(--amber-soft); border-radius:18px; padding:18px; margin-top:6px}
.hold .timer{font-size:2.6em; font-weight:700; color:var(--amber); font-variant-numeric:tabular-nums; line-height:1}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.fact{background:var(--surface); border-radius:12px; padding:10px 12px}
.fact span{display:block; font-size:.78em; color:var(--ink-3)} .fact b{font-size:1.15em}
.pin{letter-spacing:.3em}
.kiosk{background:var(--kiosk); color:#EAF0F4; border-radius:20px; padding:18px; margin-top:6px}
.kiosk .where{font-size:.8em; color:#9FB0BF; margin-bottom:10px}
.kiosk h2{color:#fff}
.reader{display:grid; place-items:center; gap:8px; width:100%; margin:16px 0 8px; padding:26px 10px; border-radius:16px; border:2px dashed #3E5366; background:var(--kiosk-2); color:#EAF0F4}
.reader svg{width:54px; height:54px}
.reader:active{transform:scale(.99)}
.grid{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:12px 0}
.cell{aspect-ratio:1/1.15; border-radius:4px; background:#2A3947; font-size:.62em; display:grid; place-items:center; color:#6D8193}
.cell.open{background:var(--teal); color:#fff; font-weight:700; font-size:.8em; outline:3px solid #7FE3C2; animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cell.open{animation:none}}
@keyframes pulse{50%{outline-color:transparent}}
.kbtn{display:block; width:100%; border-radius:12px; padding:13px; font-weight:700; margin-top:8px; border:0; background:#EAF0F4; color:var(--kiosk)}
.kbtn.ghost{background:none; color:#C9D6E1; border:1.5px solid #3E5366; font-weight:400}
.kbtn.teal{background:var(--teal); color:#fff}
.loan{border:1.5px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px}
.loan .top{display:flex; justify-content:space-between; gap:10px}
.loan .due{font-size:.86em; color:var(--ink-2)} .loan .due.today{color:var(--amber); font-weight:700}
.bar{height:6px; border-radius:3px; background:var(--surface-2); margin:10px 0 12px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--teal)} .bar i.late{background:var(--amber)}
.acts{display:flex; gap:8px; flex-wrap:wrap}
.acts button{flex:1; min-width:90px; border-radius:10px; padding:9px 8px; border:1.5px solid var(--line); background:var(--surface); font-size:.9em}
.acts button.main{background:var(--teal); border-color:var(--teal); color:#fff; font-weight:700}
.opts{display:grid; gap:8px; margin:8px 0}
.opt{text-align:left; border:1.5px solid var(--line); border-radius:12px; padding:12px; background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--teal); background:var(--teal-soft); font-weight:700}
textarea{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:10px; background:var(--surface-2); min-height:84px}
.steps{padding-left:22px; margin:6px 0 12px} .steps li{margin-bottom:6px}
.toggle{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
.toggle input{width:22px; height:22px; accent-color:var(--teal)}
.taskbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--amber-soft); border-bottom:2px solid var(--amber); padding:10px 18px; font-size:.9em}
.taskbar .tt{display:flex; justify-content:space-between; gap:10px; align-items:start}
.taskbar button{background:none; border:1.5px solid var(--amber); color:var(--amber); border-radius:8px; padding:4px 10px; font-size:.85em; flex:none}
.sus{border-bottom:1px solid var(--line); padding:12px 0}
.likert{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:8px}
.likert button{border:1.5px solid var(--line); border-radius:10px; padding:9px 0; background:var(--surface); font-weight:700}
.likert button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.lk{display:flex; justify-content:space-between; font-size:.75em; color:var(--ink-3); margin-top:3px}
table.res{width:100%; border-collapse:collapse; font-size:.82em; margin:8px 0}
table.res th,table.res td{border-bottom:1px solid var(--line); padding:6px 4px; text-align:left}
.wrap{overflow-x:auto}
.toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:12px; font-size:.9em; z-index:20; max-width:90vw}
.err{color:var(--coral); font-size:.85em; margin-top:6px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.proto{font-size:.78em; color:var(--ink-3); text-align:center; margin-top:18px}
</style>
</head>
<body>
<div class="phone">
  <div id="taskbar"></div>
  <header class="top">
    <h1>Resource Hub</h1>
    <div class="near"><label for="loc">You're near</label>
      <select id="loc"></select></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main">
    <button data-tab="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Browse</button>
    <button data-tab="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>My loans<span id="lb"></span></span></button>
    <button data-tab="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.5"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>Help</button>
    <button data-tab="test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>Test mode</button>
  </nav>
</div>
<script>
/* ---------------- data (prototype sample data from the design report) ---------------- */
const ZONES = {S:{n:"S-Blocks",x:.10}, A:{n:"North residences",x:.06}, C:{n:"Library",x:.30}, E:{n:"Berea Residence",x:.38}, D:{n:"Admin & clinic",x:.47}, H:{n:"Sports centre",x:.58}, SR:{n:"South residences",x:.90}};
const NODES = {S:{n:"Node S", place:"S-Blocks, ground floor", x:.12}, C:{n:"Node C", place:"Library entrance", x:.31}, SR:{n:"Node SR", place:"South residences, Gate 6", x:.88}};
const WALK = {S:{S:1,C:3,SR:9}, A:{S:4,C:5,SR:10}, C:{S:3,C:1,SR:7}, E:{S:4,C:3,SR:6}, D:{S:5,C:3,SR:5}, H:{S:6,C:4,SR:4}, SR:{S:9,C:7,SR:1}};
const CATS = [["all","All"],["safety","Lab & safety"],["measure","Measuring"],["tech","Tech"],["av","Camera & AV"],["every","Everyday"],["care","Health & access"]];
const ITEMS = [
 {id:"calc",name:"Scientific calculator",cat:"measure",loan:1,stock:{S:9,C:0,SR:4}},
 {id:"laptop",name:"Laptop",cat:"tech",loan:2,stock:{S:4,C:6,SR:2}},
 {id:"tablet",name:"Tablet",cat:"tech",loan:2,stock:{S:3,C:4,SR:3}},
 {id:"charger",name:"Charger / power bank",cat:"tech",loan:.5,stock:{S:5,C:6,SR:5}},
 {id:"cable",name:"HDMI / Ethernet cable",cat:"tech",loan:.5,stock:{S:3,C:4,SR:2}},
 {id:"coat",name:"Laboratory coat",cat:"safety",loan:1,stock:{S:7,C:2,SR:3}},
 {id:"goggles",name:"Safety goggles",cat:"safety",loan:.5,stock:{S:8,C:3,SR:4}},
 {id:"hardhat",name:"Hard hat",cat:"safety",loan:.5,stock:{S:3,C:1,SR:2}},
 {id:"caliper",name:"Vernier caliper",cat:"measure",loan:.5,stock:{S:3,C:1,SR:1}},
 {id:"micro",name:"Micrometer",cat:"measure",loan:.5,stock:{S:2,C:1,SR:1}},
 {id:"dslr",name:"DSLR camera",cat:"av",loan:2,stock:{S:1,C:3,SR:1}},
 {id:"tripod",name:"Tripod",cat:"av",loan:2,stock:{S:1,C:3,SR:1}},
 {id:"proj",name:"Projector",cat:"av",loan:.5,stock:{S:1,C:1,SR:0}},
 {id:"umbrella",name:"Umbrella",cat:"every",loan:.5,stock:{S:3,C:3,SR:4}},
 {id:"sport",name:"Sports equipment kit",cat:"every",loan:.3,stock:{S:0,C:1,SR:4}},
 {id:"wheel",name:"Wheelchair",cat:"care",loan:1,stock:{S:1,C:1,SR:1}},
 {id:"firstaid",name:"First aid kit",cat:"care",loan:.2,stock:{S:1,C:1,SR:1}}
];
const GLYPH = {
 safety:'<path d="M3 10.5c0-2 2-3.5 9-3.5s9 1.5 9 3.5v2c0 2-1.5 3.5-3.5 3.5-1.6 0-2.4-1-3-2.2-.5-1-1-1.3-2.5-1.3s-2 .3-2.5 1.3C8 15 7.1 16 5.5 16 3.5 16 3 14.5 3 12.5z"/>',
 measure:'<path d="M3 7h18v5H3zM6 7v2.5M9 7v3.5M12 7v2.5M15 7v3.5M18 7v2.5M5 12v6M9 12v4"/>',
 tech:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2.5 19h19"/>',
 av:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/>',
 every:'<path d="M3 12a9 9 0 0 1 18 0zM12 12v6.5a2 2 0 0 1-4 0"/>',
 care:'<path d="M12 5v14M5 12h14"/><rect x="3.5" y="3.5" width="17" height="17" rx="3"/>'
};
const TODAY = new Date(2026,8,22,14,42);
const HOLIDAYS = {"2026-09-24":"Heritage Day"};

/* ---------------- state ---------------- */
const S = {tab:"browse", view:"browse", loc:"S", cat:"all", q:"", item:null, node:null, period:0,
  reservation:null, locker:null, faultFor:null, faultReason:null, extendFor:null,
  loans:[
    {uid:"L1", item:"caliper", tag:"VC-0412", from:"S", issued:new Date(2026,8,21,9,10), due:new Date(2026,8,22,16,0)},
    {uid:"L2", item:"laptop", tag:"LT-0087", from:"C", issued:new Date(2026,8,21,11,30), due:new Date(2026,8,23,11,30)}
  ], test:null, sus:null};
const itemBy = id => ITEMS.find(i => i.id === id);
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtT = d => d.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",hour12:false});
const fmtD = d => d.toLocaleDateString("en-ZA",{weekday:"short",day:"numeric",month:"short"});
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function nearestWith(item){ return Object.keys(NODES).filter(n=>item.stock[n]>0).sort((a,b)=>WALK[S.loc][a]-WALK[S.loc][b])[0]; }

/* ---------------- campus strip (signature element) ---------------- */
function strip(item){
  const W=360,H=78,pad=16, X=f=>pad+f*(W-2*pad);
  let g=`<rect x="${pad-6}" y="30" width="${W-2*pad+12}" height="18" rx="9" fill="var(--line)"/>`;
  for(const [k,n] of Object.entries(NODES)){
    const has=item?item.stock[k]>0:true, sel=S.node===k;
    g+=`<g><rect x="${X(n.x)-9}" y="30" width="18" height="18" rx="4" fill="${sel?"var(--teal)":has?"var(--slate)":"var(--surface)"}" stroke="${has?"none":"var(--ink-3)"}" stroke-dasharray="3 2"/>
        <text x="${X(n.x)}" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${k}</text>
        <text x="${X(n.x)}" y="66" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${WALK[S.loc][k]} min</text></g>`;
  }
  const you=X(ZONES[S.loc].x);
  g+=`<circle cx="${you}" cy="39" r="6.5" fill="var(--amber)" stroke="var(--surface)" stroke-width="2.5"/>`;
  return `<div class="strip" aria-hidden="true"><svg viewBox="0 0 ${W} ${H}">${g}</svg>
    <div class="cap"><span>North: Botanic Gardens Rd</span><span>South: Gate 7</span></div></div>`;
}

/* ---------------- views ---------------- */
function vBrowse(){
  const q=S.q.toLowerCase();
  const list=ITEMS.filter(i=>(S.cat==="all"||i.cat===S.cat)&&i.name.toLowerCase().includes(q));
  const rows=list.map(i=>{
    const n=nearestWith(i), tot=Object.values(i.stock).reduce((a,b)=>a+b,0);
    const sub=!n?"None available right now":`Nearest: ${NODES[n].place.split(",")[0]}, ${WALK[S.loc][n]} min walk`;
    return `<li><button class="row" data-item="${i.id}">
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${GLYPH[i.cat]}</svg></span>
      <span class="txt"><span class="name">${i.name}</span><br><span class="sub">${sub}</span></span>
      <span class="count ${tot?"":"none"}"><b>${tot}</b>free</span></button></li>`;}).join("");
  return `<label class="sr" for="q">Search equipment</label>
    <input id="q" class="search" type="search" placeholder="Search equipment" value="${esc(S.q)}" autocomplete="off">

    else { L.stage="scan"; go("locker"); setTimeout(()=>{ if(S.locker===L){ L.stage="condition"; go("locker"); } },1300); } };
  on("[data-cond]",e=>{ const L=S.locker, c=e.currentTarget.dataset.cond;
    S.loans=S.loans.filter(x=>x.uid!==L.uid); itemBy(L.item).stock[L.node]++;
    if(c!=="good"){ S.faultFor=itemBy(L.item).name+" (tag "+L.tag+")"; S.faultReason=c==="damaged"?"damaged":"other"; S.faultBack="loans"; check("returned:"+L.item); go("fault"); toast("Returned. Tell us what's wrong so we can fix it."); return; }
    L.stage="done"; go("locker"); check("returned:"+L.item); });
  on("[data-fault]",e=>{ const L=S.locker; S.faultReason=e.currentTarget.dataset.fault; S.faultFor=`${NODES[L.node].n}, compartment ${L.comp}`; S.faultBack="locker"; go("fault"); });
  on("[data-return]",e=>{ const l=S.loans.find(x=>x.uid===e.currentTarget.dataset.return);
    const n=Object.keys(NODES).sort((a,b)=>WALK[S.loc][a]-WALK[S.loc][b])[0];
    S.locker={mode:"return",uid:l.uid,item:l.item,tag:l.tag,node:n,comp:2+Math.floor(Math.random()*20),stage:"tap"}; go("returnpick"); });
  on("[data-rnode]",e=>{ S.locker.node=e.currentTarget.dataset.rnode; go("returnpick"); });
  const gr=$("#goreturn"); if(gr) gr.onclick=()=>go("locker");
  on("[data-extend]",e=>{ S.extendFor=e.currentTarget.dataset.extend; go("extend"); });
  const de=$("#doext"); if(de) de.onclick=()=>{ const l=S.loans.find(x=>x.uid===S.extendFor);
    const nd=new Date(l.due.getTime()+24*3600e3); if(HOLIDAYS[key(nd)]){nd.setDate(nd.getDate()+1); nd.setHours(10,0,0,0);} l.due=nd;
    toast("Extended. Now due "+fmtD(nd)+"."); go("loans","loans"); check("extended:"+l.item); };
  on("[data-reportloan]",e=>{ const l=S.loans.find(x=>x.uid===e.currentTarget.dataset.reportloan); S.faultFor=itemBy(l.item).name+" (tag "+l.tag+")"; S.faultReason=null; S.faultBack="loans"; go("fault"); });
  on("[data-reason]",e=>{ S.faultReason=e.currentTarget.dataset.reason; view.querySelectorAll("[data-reason]").forEach(b=>b.setAttribute("aria-pressed",b===e.currentTarget)); const fe=$("#ferr"); if(fe) fe.textContent=""; });
  const ph=$("#photo"); if(ph) ph.onclick=()=>{ ph.textContent="Photo added"; ph.disabled=true; };
  const sf=$("#sendfault"); if(sf) sf.onclick=()=>{ if(!S.faultReason){ $("#ferr").textContent="Choose what happened first."; return; }
    const ref="WO-"+(2300+Math.floor(Math.random()*600)), reason=S.faultReason;
    if(S.faultBack==="locker"&&S.locker&&S.locker.mode==="collect"&&S.reservation&&(S.faultReason==="noopen"||S.faultReason==="wrong")){ S.reservation.node=S.locker.node; S.reservation.comp=S.locker.comp===24?1:S.locker.comp+1; }
    view_render(`<h2>Fault reported</h2><div class="note ok">Reference <b>${ref}</b>. A technician has been notified.</div>
      <p>${(reason==="noopen"||reason==="wrong")&&S.reservation?`We've moved your reservation to compartment ${S.reservation.comp} at the same locker, so you can still collect it now.`:(reason==="noopen"&&S.locker&&S.locker.mode==="return")?"Tap your card again and the locker will open a different compartment for your return.":"You won't be charged for a fault you report. We'll check the item before it's lent again."}</p>
      <button class="btn primary" data-go="${S.reservation?"reserved":"loans"}">${S.reservation?"Back to my reservation":"Back to my loans"}</button>`);
    check("fault:"+reason); };
  const lg=$("#lg"); if(lg) lg.onchange=e=>document.documentElement.classList.toggle("large",e.target.checked);
  const hc=$("#hc"); if(hc) hc.onchange=e=>document.documentElement.classList.toggle("contrast",e.target.checked);
  const np=$("#newp"); if(np) np.onclick=()=>{ const id="P"+String(RES.length+1).padStart(2,"0"); RES.push({id,tasks:{},sus:null}); saveRes(RES); S.pid=id; S.sus=null; go("test","test"); };
  const ep=$("#endp"); if(ep) ep.onclick=()=>{ S.pid=null; go("test","test"); };
  on("[data-starttask]",e=>startTask(e.currentTarget.dataset.starttask));
  on("[data-sus]",e=>{ const [k,v]=e.currentTarget.dataset.sus.split(":").map(Number); S.sus[k]=v;
    e.currentTarget.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===e.currentTarget)); $("#suserr").textContent=""; });
  const sd=$("#susdone"); if(sd) sd.onclick=()=>{ const miss=S.sus.findIndex(v=>v==null);
    if(miss>=0){ $("#suserr").textContent=`Answer question ${miss+1} first.`; return; }
    const score=S.sus.reduce((a,v,k)=>a+(k%2===0?v-1:5-v),0)*2.5; const p=curP(); if(p){ p.sus=score; saveRes(RES); }
    S.sus=null; toast("Thanks. Please hand the phone back."); go("test","test"); };
  const wp=$("#wipe"); if(wp) wp.onclick=()=>{ if(wp.dataset.sure){ RES=[]; saveRes(RES); S.pid=null; go("test","test"); } else { wp.dataset.sure="1"; wp.textContent="Tap again to delete all results"; } };
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ const t=b.dataset.tab; go(t,t); }));
const locSel=$("#loc"); locSel.innerHTML=Object.entries(ZONES).map(([k,z])=>`<option value="${k}">${z.n}</option>`).join("");
locSel.value=S.loc; locSel.onchange=e=>{ S.loc=e.target.value; go(S.view); };
document.addEventListener("click",()=>{ if(S.test) S.test.taps++; },true);
resetDemo(); go("browse","browse");
</script>
</body>
</html>
